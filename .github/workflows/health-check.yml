name: Continuous dashboard health monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-health-monitor
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5

      - name: Check deployed dashboard
        env:
          APP_URL: ${{ secrets.APP_URL }}
          HEALTH_ATTEMPTS: "5"
          HEALTH_TIMEOUT: "20"
        run: python scripts/health_monitor.py
